services:

  # ── PostgreSQL Datenbank ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget_secret
      POSTGRES_DB: budget_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_db"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ── Auth-Dienst (FastAPI) ─────────────────────────────────────────────────
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://budget:budget_secret@db:5432/budget_db
      JWT_SECRET: ${JWT_SECRET:-bitte-in-produktion-aendern!}
      # Initialer Admin-Nutzer – nur beim ersten Start wirksam
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Auth-Service ist nur intern erreichbar (kein Port nach außen nötig)
    # Falls direkter Zugriff gewünscht: ports: ["8001:8001"]

  # ── Budget-Planer App (NiceGUI) ───────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://budget:budget_secret@db:5432/budget_db
      AUTH_SERVICE_URL: http://auth:8001
      NICEGUI_SECRET: ${NICEGUI_SECRET:-nicegui-session-secret-bitte-aendern!}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
    driver: local
